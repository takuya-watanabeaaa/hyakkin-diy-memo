# YouTube チャンネルの新着を検知し tools/affiliate/main.py を実行する。
# Secrets: YOUTUBE_API_KEY, YOUTUBE_CHANNEL_ID, OPENAI_API_KEY, アフィリエイト用テンプレ 等
# 状態ファイルは Actions cache で保持（初回は記事を生成せず baseline のみ — channel_watch の既定）。

name: Affiliate channel watch

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "main.py に --dry-run を渡す"
        type: boolean
        default: false
      first_run:
        description: "状態キャッシュが空のときの挙動（generate-latest は最新1本生成）"
        type: choice
        options:
          - skip
          - generate-latest
        default: skip
  schedule:
    # 03:15 UTC ≈ 日本時間 正午前後（夏時間でずれるため必要なら調整）
    - cron: "15 3 * * *"

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/affiliate/requirements.txt

      - uses: actions/cache@v4
        id: channel-state
        with:
          path: tools/affiliate/.cache/youtube_channel_state.json
          key: affiliate-yt-state-${{ secrets.YOUTUBE_CHANNEL_ID }}-v1

      - name: Install Python deps
        run: pip install -r tools/affiliate/requirements.txt

      - name: Channel watch → generate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          RAKUTEN_SEARCH_LINK_TEMPLATE: ${{ secrets.RAKUTEN_SEARCH_LINK_TEMPLATE }}
          A8_LINK_TEMPLATE: ${{ secrets.A8_LINK_TEMPLATE }}
          A8_LINK_TEMPLATE_ALT: ${{ secrets.A8_LINK_TEMPLATE_ALT }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
        run: |
          ARGS=(--state tools/affiliate/.cache/youtube_channel_state.json)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
              ARGS+=(--dry-run)
            fi
            ARGS+=(--first-run "${{ github.event.inputs.first_run }}")
          else
            ARGS+=(--first-run skip)
          fi
          python tools/affiliate/channel_watch.py "${ARGS[@]}"

      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: affiliate-output-channel
          path: output/
          if-no-files-found: ignore
